<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>お問い合わせありがとうございます | 古村綾子ポートフォリオ</title>
    <link rel="preconnect" href="https://use.typekit.net" />
    <link rel="preconnect" href="https://p.typekit.net" crossorigin />
    <script src="./js/typekit.js" defer></script>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body class="contact_page thanks_page" id="top">
    <header class="header">
      <button
        class="menu_button"
        type="button"
        aria-label="メニューを開く"
        aria-controls="site-menu"
        aria-expanded="false"
      >
        <img
          decoding="async"
          class="menu_button_img"
          src="./images/common/menu.png"
          alt=""
        />
        <span class="menu_button_text">menu</span>
      </button>
      <nav class="site_menu" id="site-menu" aria-label="サイトメニュー" hidden>
        <a href="./index.html">Top</a>
        <a href="./index.html#introduction">Introduction</a>
        <a href="./index.html#speciality">Speciality</a>
        <a href="./performances.html">Performance</a>
        <a href="./contact.html">Casting Call</a>
      </nav>
    </header>

    <main class="contact_main">
      <section class="contact_stage thanks_stage">
        <div class="contact_stars" aria-hidden="true"></div>
        <picture class="contact_curtain_picture" aria-hidden="true">
          <source
            media="(max-width: 768px)"
            srcset="./images/performances-list/redcarten-sp.webp"
          />
          <img
            decoding="async"
            class="contact_curtain"
            src="./images/performances-list/redcarten.png"
            alt=""
          />
        </picture>

        <div class="contact_inner thanks_inner">
          <h1 class="thanks_title">Thank you!</h1>
          <p class="thanks_message">
            お問い合わせ内容を拝見し、3営業日以内のご連絡いたします。少々お待ちください。
          </p>
          <a class="thanks_back" href="./index.html">
            <img
              decoding="async"
              src="./images/thankspage/back-btn-thanks.png"
              alt="Back to Top"
            />
          </a>
        </div>
      </section>
    </main>

    <footer class="contact_footer thanks_footer">
      <img
        decoding="async"
        class="contact_footer_floor"
        src="./images/common/wood-floor.webp"
        alt=""
      />
      <img
        decoding="async"
        class="thanks_footer_illust"
        src="./images/thankspage/thanks-myself.png"
        alt="お辞儀をする制作者と犬のイラスト"
      />
      <p class="copyright">© Ayako Furumura. All rights reserved.</p>
    </footer>
    <script src="./js/common.js" defer></script>
  </body>
</html>
