<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>制作実績一覧 | 古村綾子ポートフォリオ</title>
    <link rel="preconnect" href="https://use.typekit.net" />
    <link rel="preconnect" href="https://p.typekit.net" crossorigin />
    <script src="./js/typekit.js" defer></script>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body class="performance_list_page" id="top">
    <header class="header">
      <button
        class="menu_button"
        type="button"
        aria-label="メニューを開く"
        aria-controls="site-menu"
        aria-expanded="false"
      >
        <img
          decoding="async"
          class="menu_button_img"
          src="./images/common/menu.png"
          alt=""
        />
        <span class="menu_button_text">menu</span>
      </button>
      <nav class="site_menu" id="site-menu" aria-label="サイトメニュー" hidden>
        <a href="./index.html">Top</a>
        <a href="./index.html#introduction">Introduction</a>
        <a href="./index.html#speciality">Speciality</a>
        <a href="./performances.html">Performance</a>
        <a href="./contact.html">Casting Call</a>
      </nav>
    </header>

    <main class="performance_list_main">
      <section class="performance_list_hero">
        <div class="performance_list_stars" aria-hidden="true"></div>
        <picture class="performance_detail_curtain_picture" aria-hidden="true">
          <source
            media="(max-width: 768px)"
            srcset="./images/performances-list/redcarten-sp.webp"
          />
          <img
            decoding="async"
            class="performance_list_curtain performance_detail_curtain"
            src="./images/performances-list/redcarten.png"
            alt=""
          />
        </picture>
        <div
          class="performance_bg_star performance_bg_star-left"
          aria-hidden="true"
        ></div>
        <div
          class="performance_bg_star performance_bg_star-right"
          aria-hidden="true"
        ></div>

        <div class="performance_list_inner">
          <h1 class="performance_list_title">
            <span class="performance_list_ruby">ワークス</span>
            Performances
            <img
              loading="lazy"
              decoding="async"
              class="performance_list_title_star performance_list_title_star-left"
              src="./images/performance-common/title-star-left.png"
              alt=""
            />
            <img
              loading="lazy"
              decoding="async"
              class="performance_list_title_star performance_list_title_star-right"
              src="./images/performance-common/title-star-right.png"
              alt=""
            />
          </h1>

          <ul class="performance_gallery" aria-label="制作実績一覧">
            <li class="performance_gallery_item performance_gallery_item-salon">
              <a href="./performances_hairsalon.html">
                <span class="performance_frame">
                  <img
                    loading="lazy"
                    decoding="async"
                    class="performance_frame_img performance_frame_img-mono"
                    src="./images/performances-list/salon-mono.png"
                    alt="美容室Webサイトの制作実績"
                  />
                  <img
                    loading="lazy"
                    decoding="async"
                    class="performance_frame_img performance_frame_img-color"
                    src="./images/performances-list/salon-color.png"
                    alt=""
                  />
                </span>
                <span class="performance_label"
                  >美容室<br class="sp_only_br" />Webサイト</span
                >
              </a>
            </li>

            <li
              class="performance_gallery_item performance_gallery_item-burger"
            >
              <a href="./performances_burger.html">
                <span class="performance_frame performance_frame-slideshow">
                  <img
                    loading="lazy"
                    decoding="async"
                    class="performance_frame_img performance_frame_img-mono performance_frame_img-slide performance_frame_img-slide-a"
                    src="./images/performances-list/burger-mono.png"
                    alt="新商品バーガー告知バナーA案の制作実績"
                  />
                  <img
                    loading="lazy"
                    decoding="async"
                    class="performance_frame_img performance_frame_img-mono performance_frame_img-slide performance_frame_img-slide-b"
                    src="./images/performances-list/burger-b-mono.png"
                    alt="新商品バーガー告知バナーB案の制作実績"
                  />
                  <img
                    loading="lazy"
                    decoding="async"
                    class="performance_frame_img performance_frame_img-color performance_frame_img-slide performance_frame_img-slide-a"
                    src="./images/performances-list/burger-color.png"
                    alt=""
                  />
                  <img
                    loading="lazy"
                    decoding="async"
                    class="performance_frame_img performance_frame_img-color performance_frame_img-slide performance_frame_img-slide-b"
                    src="./images/performances-list/burger-b-color.png"
                    alt=""
                  />
                </span>
                <span class="performance_label">
                  新商品バーガー<br class="sp_only_br" />告知バナー<br />-
                  ABテスト -
                </span>
              </a>
            </li>

            <li class="performance_gallery_item performance_gallery_item-ice">
              <a href="./performances_ice.html">
                <span class="performance_frame performance_frame-slideshow">
                  <img
                    loading="lazy"
                    decoding="async"
                    class="performance_frame_img performance_frame_img-mono performance_frame_img-slide performance_frame_img-slide-a"
                    src="./images/performances-list/ice-a-mono.png"
                    alt="夏季限定アイスクリームバナーA案の制作実績"
                  />
                  <img
                    loading="lazy"
                    decoding="async"
                    class="performance_frame_img performance_frame_img-mono performance_frame_img-slide performance_frame_img-slide-b"
                    src="./images/performances-list/ice-b-mono.png"
                    alt="夏季限定アイスクリームバナーB案の制作実績"
                  />
                  <img
                    loading="lazy"
                    decoding="async"
                    class="performance_frame_img performance_frame_img-color performance_frame_img-slide performance_frame_img-slide-a"
                    src="./images/performances-list/ice-a-color.png"
                    alt=""
                  />
                  <img
                    loading="lazy"
                    decoding="async"
                    class="performance_frame_img performance_frame_img-color performance_frame_img-slide performance_frame_img-slide-b"
                    src="./images/performances-list/ice-b-color.png"
                    alt=""
                  />
                </span>
                <span class="performance_label"
                  >夏季限定<br />アイスクリーム<br
                    class="sp_only_br"
                  />バナー</span
                >
              </a>
            </li>

            <li
              class="performance_gallery_item performance_gallery_item-workers"
            >
              <a href="./performances_workers.html">
                <span class="performance_frame">
                  <img
                    loading="lazy"
                    decoding="async"
                    class="performance_frame_img performance_frame_img-mono"
                    src="./images/performances-list/workers-mono.png"
                    alt="コワーキングスペースLPの制作実績"
                  />
                  <img
                    loading="lazy"
                    decoding="async"
                    class="performance_frame_img performance_frame_img-color"
                    src="./images/performances-list/workers-color.png"
                    alt=""
                  />
                </span>
                <span class="performance_label"
                  >コワーキング<br class="sp_only_br" />スペースLP</span
                >
              </a>
            </li>

            <li class="performance_gallery_item performance_gallery_item-cafe">
              <a href="./performances_designcafe.html">
                <span class="performance_frame">
                  <img
                    loading="lazy"
                    decoding="async"
                    class="performance_frame_img performance_frame_img-mono"
                    src="./images/performances-list/DesignCafe-mono.png"
                    alt="カフェWebサイトの制作実績"
                  />
                  <img
                    loading="lazy"
                    decoding="async"
                    class="performance_frame_img performance_frame_img-color"
                    src="./images/performances-list/DesignCafe-color.png"
                    alt=""
                  />
                </span>
                <span class="performance_label"
                  >カフェ<br class="sp_only_br" />Webサイト</span
                >
              </a>
            </li>

            <li
              class="performance_gallery_item performance_gallery_item-mobile"
            >
              <a href="./performances_mobile.html">
                <span class="performance_frame">
                  <img
                    loading="lazy"
                    decoding="async"
                    class="performance_frame_img performance_frame_img-mono"
                    src="./images/performances-list/mobile-mono.png"
                    alt="スマホ学割バナーの制作実績"
                  />
                  <img
                    loading="lazy"
                    decoding="async"
                    class="performance_frame_img performance_frame_img-color"
                    src="./images/performances-list/mobile-color.png"
                    alt=""
                  />
                </span>
                <span class="performance_label"
                  >スマホ学割<br class="sp_only_br" />バナー</span
                >
              </a>
            </li>
          </ul>

          <a class="performance_contact_link" href="./contact.html">
            <img
              loading="lazy"
              decoding="async"
              src="./images/common/contact-btn.png"
              alt="お問い合わせ"
            />
          </a>

          <a class="performance_back_link" href="./index.html">
            <img
              loading="lazy"
              decoding="async"
              src="./images/common/back-btn.png"
              alt="Back to Top"
            />
          </a>
        </div>
      </section>
    </main>

    <footer class="performance_list_footer">
      <img
        loading="lazy"
        decoding="async"
        class="performance_list_footer_floor"
        src="./images/common/wood-floor.webp"
        alt=""
      />
      <img
        loading="lazy"
        decoding="async"
        class="performance_list_footer_illust"
        src="./images/performances-list/performancelist-footer-myself.png"
        alt="制作者のイラスト"
      />
      <p class="copyright">&copy;Ayako Furumura. All Rights Reserved.</p>
    </footer>
    <script src="./js/common.js" defer></script>
  </body>
</html>
