<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>お問い合わせ | 古村綾子ポートフォリオ</title>
    <link rel="preconnect" href="https://use.typekit.net" />
    <link rel="preconnect" href="https://p.typekit.net" crossorigin />
    <script src="./js/typekit.js" defer></script>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body class="contact_page" id="top">
    <script type="text/javascript">
      let submitted = false;
    </script>
    <iframe
      name="hidden_iframe"
      id="hidden_iframe"
      style="display: none"
      onload="
        if (submitted) {
          window.location = 'thanks.html';
        }
      "
    ></iframe>
    <header class="header">
      <button
        class="menu_button"
        type="button"
        aria-label="メニューを開く"
        aria-controls="site-menu"
        aria-expanded="false"
      >
        <img
          decoding="async"
          class="menu_button_img"
          src="./images/common/menu.png"
          alt=""
        />
        <span class="menu_button_text">menu</span>
      </button>
      <nav class="site_menu" id="site-menu" aria-label="サイトメニュー" hidden>
        <a href="./index.html">Top</a>
        <a href="./index.html#introduction">Introduction</a>
        <a href="./index.html#speciality">Speciality</a>
        <a href="./performances.html">Performance</a>
        <a href="./contact.html">Casting Call</a>
      </nav>
    </header>

    <main class="contact_main">
      <section class="contact_stage">
        <div class="contact_stars" aria-hidden="true"></div>
        <picture class="contact_curtain_picture" aria-hidden="true">
          <source
            media="(max-width: 768px)"
            srcset="./images/performances-list/redcarten-sp.webp"
          />
          <img
            decoding="async"
            class="contact_curtain"
            src="./images/performances-list/redcarten.png"
            alt=""
          />
        </picture>

        <div class="contact_inner">
          <h1 class="contact_title">
            Casting<br class="sp_only_br" />
            Call
            <span>お問い合わせ</span>
          </h1>

          <form
            class="contact_form"
            action="https://docs.google.com/forms/u/0/d/e/1FAIpQLSe4YV5ZApZfaZpdQtyhUIIjx3UCfv5U8nlLMKcARp1_pmsj7w/formResponse"
            method="POST"
            target="hidden_iframe"
            onsubmit="submitted = true"
          >
            <div class="contact_form_row">
              <label for="name"
                >お名前<span class="contact_required">必須</span></label
              >
              <input
                id="name"
                name="entry.1860722277"
                type="text"
                autocomplete="name"
                required="required"
              />
            </div>
            <div class="contact_form_row">
              <label for="email"
                >メールアドレス<span class="contact_required">必須</span></label
              >
              <input
                id="email"
                name="entry.390871118"
                type="email"
                autocomplete="email"
                required="required"
              />
            </div>
            <div class="contact_form_row contact_form_row-message">
              <label for="message"
                >ご依頼・ご相談内容<span class="contact_required"
                  >必須</span
                ></label
              >
              <textarea
                id="message"
                name="entry.1026595757"
                required="required"
              ></textarea>
            </div>
            <button class="contact_submit" type="submit">
              <img
                loading="lazy"
                decoding="async"
                src="./images/contact/send-btn.png"
                alt="送信"
              />
            </button>
          </form>
        </div>
      </section>
    </main>

    <footer class="contact_footer">
      <img
        loading="lazy"
        decoding="async"
        class="contact_footer_floor"
        src="./images/common/wood-floor.webp"
        alt=""
      />
      <img
        loading="lazy"
        decoding="async"
        class="contact_footer_illust"
        src="./images/contact/contact-myself.png"
        alt="お問い合わせを受け付ける制作者のイラスト"
      />
      <img
        loading="lazy"
        decoding="async"
        class="contact_footer_comment"
        src="./images/contact/comment.png"
        alt="お問い合わせはお気軽にどうぞ！"
      />
      <p class="copyright">&copy; Ayako Furumura. All rights reserved.</p>
    </footer>
    <script src="./js/common.js" defer></script>
  </body>
</html>
